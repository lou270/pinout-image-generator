name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pillow svglib reportlab

      - name: Run automated tests
        run: |
          python -m unittest discover -s tests -v

      - name: Build PCM package
        run: |
          DOWNLOAD_URL_BASE="https://github.com/${{ github.repository }}/releases/download"
          python scripts/build_pcm_package.py --download-url-base "$DOWNLOAD_URL_BASE" --tag "${{ github.ref_name }}"

      - name: Upload release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/metadata.json

      - name: Upload as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pcm-package
          path: |
            dist/*.zip
            dist/metadata.json
